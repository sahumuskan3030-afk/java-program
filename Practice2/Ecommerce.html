<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
        <title>E-Commerce Website</title>
        <link rel="stylesheet" href="Ecommerce.css">
    </head>
    <body>
        <!--header-->
        <header>
            <h1>My Shop</h1>

            <nav>
                <a href="#">Home</a>
                <a href="#">Product</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <!--Hero Section-->
        <section class="hero">
            <h2>Welcome to my Store</h2>
            <p>
                Best Deals on Electronics & Fashion
            </p>
            <button>Shop Now</button>
        </section>
<hr>
        <!--Product-->
        <section class="product">
            <div class="card">
                <img src="https://img.freepik.com/premium-psd/isolated-image-smart-phone_976269-975.jpg" height="200px" alt="">
                <h2>Smart Phone</h2>
                <p>Rs15,999</p>
                <button>Add to Cart</button>
            </div>

            <div class="card">
                <img src="https://tse1.mm.bing.net/th/id/OIP.IhRGxFA971_GUrGtnCP1xgHaFx?pid=Api&P=0&h=180" height="200px" alt="">
                <h2> Dell Laptop</h2>
                <p>Rs60,999</p>
                <button>Add to Cart</button>
            </div>

            <div class="card">
                <img src="https://m.media-amazon.com/images/I/61WqF8Y6HTL._SL1500_.jpg" height="200px" alt="">
                <h2>Boat Headphone</h2>
                 <p>Rs1,999</p>
                 <button>Add to Cart</button>
            </div>
        </section>
<hr>
        <footer id="fot">
            @ 2026 My Shop | All Rights Reserved
        </footer>

    </body>
</html>
