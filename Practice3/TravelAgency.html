<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Agency</title>
    <link rel="stylesheet" href="TravelAgency.css">
</head>
<body>
    <!--navbar-->
    <header>
        <nav>
            <h2 class="logo">Travel </h2>
            <p class="go">Go</p>
            <ul>
                <li class="move">
                    <a href="#">Home</a>
                    <a href="#">Destination</a>
                    <a href="#">Package</a>
                    <a href="#">Gallery</a>
                    <a href="#">Contact</a>
                </li>
            </ul>
        </nav>
    </header>

    <!--hero section-->
    <section class="hero">
        <div class="content">
            <h1>Explore The World</h1>
            <p>Discover amazing place with afforadable travel package.</p>
            <button>Book now</button>
        </div>
      
    </section>

    <!--destination-->
    <section class="Destination">
        <h2>Popular Destination</h2>
        <div class="cards">
            <div class="card">
                <img src="https://images.pexels.com/photos/38238/maldives-ile-beach-sun-38238.jpeg?cs=srgb&dl=pexels-pixabay-38238.jpg&fm=jpg" alt="">
                <h3>Maldives</h3>
                <p>Starting from ₹29,999</p>
            </div>

            <div class="card">
                <img src="https://wallpaper.forfun.com/fetch/e2/e249dc2e2c788a04f4b086b96adba6d9.jpeg" alt="">
                <h3>Paris</h3>
                <p>Starting from ₹59,999</p>
            </div>

            <div class="card">
                <img src="https://wallpapers.com/images/hd/dubai-sparkling-lights-921jz2a0jq1nkggb.jpg" alt="">
                <h3>Dubia</h3>
                <p>Starting from ₹39,999</p>
            </div>
        </div>
    </section>

    <!--footer-->
    <footer>
        <p> 2026 TravelGo | All Rights Reserved</p>
    </footer>
</body>
</html>
